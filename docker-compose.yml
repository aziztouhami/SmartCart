version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: smartcart_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-smartcart_db}
      POSTGRES_USER: ${DB_USER:-smartcart_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - smartcart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartcart_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Symfony Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcart_backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: postgresql://${DB_USER:-smartcart_user}:${DB_PASSWORD:-smartcart_password}@postgres:5432/${DB_NAME:-smartcart_db}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
      - /app/var
    networks:
      - smartcart_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install &&
             php bin/console doctrine:database:create --if-not-exists &&
             php bin/console doctrine:migrations:migrate --no-interaction &&
             php -S 0.0.0.0:8000 -t public"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcart_frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - smartcart_network
    depends_on:
      - backend
    command: npm start

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: smartcart_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/public:/app/public
    networks:
      - smartcart_network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

networks:
  smartcart_network:
    driver: bridge

volumes:
  postgres_data:
