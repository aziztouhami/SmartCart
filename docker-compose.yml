services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: smartcart_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-scdb}
      POSTGRES_USER: ${DB_USER:-scu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Symfony Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcart_backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: postgresql://${DB_USER:-scu}:${DB_PASSWORD:-scp}@postgres:5432/${DB_NAME:-scdb}
      APP_SECRET: ${APP_SECRET:-change_this_to_a_random_string_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
      - /app/var
    networks:
      - smartcart_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             if [ ! -f config/jwt/private.pem ]; then
               mkdir -p config/jwt &&
               openssl genrsa -out config/jwt/private.pem 4096 &&
               openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem;
             fi &&
             php bin/console doctrine:database:create --if-not-exists &&
             php bin/console doctrine:migrations:migrate --no-interaction &&
             php -S 0.0.0.0:8000 -t public public/index.php"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcart_frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    networks:
      - smartcart_network
    depends_on:
      - backend

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: smartcart_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/public:/app/public
    networks:
      - smartcart_network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

networks:
  smartcart_network:
    driver: bridge

volumes:
  postgres_data:
