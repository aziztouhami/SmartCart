doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    
    # Server version for PostgreSQL
    server_version: '15'
    
    # Character set
    charset: utf8
    
    # Logging and debugging
    logging: '%kernel.debug%'
    profiling: '%kernel.debug%'
    
    # Connection parameters
    mapping_types:
      enum: string
  
  orm:
    auto_generate_proxy_classes: '%kernel.debug%'

    # Entity managers
    entity_managers:
      default:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware

        # Mapping configuration
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App
          AppRecommendation:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Recommendation/Entity'
            prefix: 'App\Recommendation\Entity'
            alias: AppRecommendation

        # Query cache
        query_cache_driver:
          type: pool
          pool: doctrine.system_cache_pool

        # Result cache
        result_cache_driver:
          type: pool
          pool: doctrine.system_cache_pool

        # Metadata cache
        metadata_cache_driver:
          type: pool
          pool: doctrine.system_cache_pool
# Cache configuration for Doctrine
framework:
  cache:
    pools:
      doctrine.system_cache_pool:
        adapter: cache.app
        default_lifetime: 0
      doctrine.result_cache_pool:
        adapter: cache.app
        default_lifetime: 3600
